<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">TikZ-Implementierung eines Petri-Netzes</title>
  <desc id="desc">LaTeX-Code mit Schleifen, Winkeln und Koordinaten zur parametrischen Konstruktion eines Petri-Netzes</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2940"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <style>
      .code { font: 40px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #e5e7eb; }
      .number { font: 25px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #667085; }
      .command { fill: #c4a7ff; }
      .option { fill: #7dd3fc; }
      .value { fill: #f6c177; }
      .comment { fill: #86d9a0; }
    </style>
  </defs>

  <rect width="1600" height="1000" rx="28" fill="url(#panel)"/>
  <rect x="1" y="1" width="1598" height="998" rx="27" fill="none" stroke="#334155" stroke-width="2"/>
  <circle cx="58" cy="52" r="12" fill="#fb7185"/>
  <circle cx="96" cy="52" r="12" fill="#f6c177"/>
  <circle cx="134" cy="52" r="12" fill="#86d9a0"/>
  <text x="1540" y="62" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="28" fill="#94a3b8">petrinetz.tex</text>
  <line x1="34" y1="94" x2="1566" y2="94" stroke="#334155" stroke-width="2"/>
  <line x1="102" y1="112" x2="102" y2="968" stroke="#334155" stroke-width="2"/>

  <g class="number" text-anchor="end">
    <text x="76" y="150">01</text><text x="76" y="192">02</text>
    <text x="76" y="234">03</text><text x="76" y="276">04</text>
    <text x="76" y="318">05</text><text x="76" y="360">06</text>
    <text x="76" y="402">07</text><text x="76" y="444">08</text>
    <text x="76" y="486">09</text><text x="76" y="528">10</text>
    <text x="76" y="570">11</text><text x="76" y="612">12</text>
    <text x="76" y="654">13</text><text x="76" y="696">14</text>
    <text x="76" y="738">15</text><text x="76" y="780">16</text>
    <text x="76" y="822">17</text><text x="76" y="864">18</text>
    <text x="76" y="906">19</text><text x="76" y="948">20</text>
  </g>

  <g class="code" xml:space="preserve">
    <text x="128" y="150" class="command">\begin{tikzpicture}[<tspan class="option">&gt;=Stealth</tspan>,</text>
    <text x="128" y="192">  every place/.style={inner sep=<tspan class="value">0pt</tspan>, outer sep=<tspan class="value">0pt</tspan>},</text>
    <text x="128" y="234">  every transition/.style={inner sep=<tspan class="value">0pt</tspan>, outer sep=<tspan class="value">0pt</tspan>}</text>
    <text x="128" y="276">]</text>
    <text x="128" y="318" class="comment">% Parametric node placement</text>
    <text x="128" y="360" class="command">\foreach \i/\angle in {</text>
    <text x="128" y="402">  <tspan class="value">1/270, 2/342, 3/54, 4/126, 5/198</tspan></text>
    <text x="128" y="444">} {</text>
    <text x="128" y="486" class="command">  \node[transition] (start-\i)</text>
    <text x="128" y="528">    at ({<tspan class="value">2*cos(\angle)</tspan>}, {<tspan class="value">2*sin(\angle)</tspan>}) {};</text>
    <text x="128" y="570" class="command">  \node[transition] (finish-\i)</text>
    <text x="128" y="612">    at ({<tspan class="value">5*cos(\angle)</tspan>}, {<tspan class="value">5*sin(\angle)</tspan>}) {};</text>
    <text x="128" y="654">}</text>
    <text x="128" y="696" class="comment">% Cyclic connections</text>
    <text x="128" y="738" class="command">\foreach \i/\next in {<tspan class="value">1/2, 2/3, 3/4, 4/5, 5/1</tspan>} {</text>
    <text x="128" y="780" class="command">  \draw (active-\i) edge[post, bend right=15]</text>
    <text x="128" y="822">    (start-\i);</text>
    <text x="128" y="864" class="command">  \draw (stick-\i) edge[post]</text>
    <text x="128" y="906">    (start-\next);</text>
    <text x="128" y="948">}</text>
  </g>
</svg>
